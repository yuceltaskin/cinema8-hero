  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;

        e.target.tagName, String(e.target.src || e.target.href || ''));

    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));

    const templateEl = document.querySelector('script[type="__bundler/template"]');

      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from

    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      ? window.origin
      : '*';

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss

          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;

      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];

            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();

            writer.close();

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.

            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

{{ sl.minL }}<\u002Fspan><span style=\"text-align:center\">{{ sl.hint }}<\u002Fspan><span>{{ sl.maxL }}<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:16px\">\n        <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px\"><h2 style=\"margin:0;font-family:Exo,sans-serif;font-size:21px;font-weight:700\">Plans that fit<\u002Fh2><span style=\"font-size:13px;color:#5b6070\">Pick another plan to compare. Plans that can't hold your library are greyed out.<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px;padding-top:8px\">\n          <sc-for list=\"{{ plans }}\" as=\"p\" hint-placeholder-count=\"5\">\n            <button type=\"button\" sc-camel-on-click=\"{{ p.pick }}\" disabled=\"{{ p.off }}\" aria-pressed=\"{{ p.on }}\" style=\"all:unset;box-sizing:border-box;cursor:{{ p.cur }};position:relative;display:flex;flex-direction:column;gap:10px;padding:20px 16px 16px;border-radius:18px;opacity:{{ p.op }};background:{{ p.bg }};box-shadow:{{ p.ring }};transition:box-shadow .2s,background .2s\" style-hover=\"box-shadow:inset 0 0 0 2px #d49bff\">\n              <sc-if value=\"{{ p.isRec }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"position:absolute;top:-11px;left:12px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:800;color:#fff;background:linear-gradient(90deg,#e91f54,#a101ff)\">Best fit<\u002Fspan><\u002Fsc-if>\n              <span style=\"font-size:16px;font-weight:800\">{{ p.name }}<\u002Fspan>\n              <span style=\"display:flex;align-items:baseline;gap:3px\"><span style=\"font-family:Exo,sans-serif;font-size:24px;font-weight:700;letter-spacing:-0.02em\">{{ p.total }}<\u002Fspan><span style=\"font-size:12px;color:#5b6070\">/mo<\u002Fspan><\u002Fspan>\n              <span style=\"font-size:12px;line-height:1.45;color:{{ p.noteC }}\">{{ p.note }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <aside aria-live=\"polite\" style=\"box-sizing:border-box;flex:1 1 320px;min-width:0;position:sticky;top:20px;display:flex;flex-direction:column;gap:22px;padding:32px 28px;border-radius:28px;color:#fff;background:radial-gradient(ellipse at 15% 0%,rgba(161,1,255,.45),transparent 60%),radial-gradient(ellipse at 100% 100%,rgba(233,31,84,.32),transparent 55%),#16121f\">\n      <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px\">\n        <span style=\"font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#d49bff\">Your estimate<\u002Fspan>\n        <div role=\"group\" aria-label=\"Billing\" style=\"display:flex;padding:3px;border-radius:999px;background:rgba(255,255,255,.1)\">\n          <sc-for list=\"{{ bills }}\" as=\"b\" hint-placeholder-count=\"2\">\n            <button type=\"button\" sc-camel-on-click=\"{{ b.pick }}\" aria-pressed=\"{{ b.on }}\" style=\"all:unset;cursor:pointer;padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:800;color:{{ b.c }};background:{{ b.bg }}\">{{ b.l }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:4px\">\n        <span style=\"font-size:15px;font-weight:800\">{{ planName }}<\u002Fspan>\n        <span style=\"display:flex;align-items:baseline;gap:6px\"><span style=\"font-size:15px;color:rgba(255,255,255,.75)\">{{ totalPre }}<\u002Fspan><span style=\"font-family:Exo,sans-serif;font-size:54px;font-weight:700;letter-spacing:-0.03em;line-height:1\">{{ total }}<\u002Fspan><span style=\"font-size:15px;color:rgba(255,255,255,.75)\">/ month<\u002Fspan><\u002Fspan>\n        <span style=\"font-size:13px;color:rgba(255,255,255,.75)\">{{ billNote }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:14px\">\n        <sc-for list=\"{{ meters }}\" as=\"m\" hint-placeholder-count=\"3\">\n          <div style=\"display:flex;flex-direction:column;gap:6px\">\n            <span style=\"display:flex;justify-content:space-between;gap:10px;font-size:13px\"><span style=\"color:rgba(255,255,255,.8)\">{{ m.l }}<\u002Fspan><b style=\"white-space:nowrap\">{{ m.v }}<\u002Fb><\u002Fspan>\n            <span style=\"height:6px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden\"><span style=\"display:block;height:100%;width:{{ m.pct }}%;border-radius:99px;background:{{ m.bar }};transition:width .3s\"><\u002Fspan><\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:12px;padding:18px 0;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 -1px 0 rgba(255,255,255,.14)\">\n        <sc-for list=\"{{ lines }}\" as=\"ln\" hint-placeholder-count=\"1\">\n          <span style=\"display:flex;justify-content:space-between;gap:12px;font-size:14px\"><span style=\"color:rgba(255,255,255,.8)\">{{ ln.l }}<\u002Fspan><b style=\"white-space:nowrap\">{{ ln.v }}<\u002Fb><\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <sc-if value=\"{{ hasNote }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"display:flex;gap:10px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.08);font-size:13px;line-height:1.55;color:rgba(255,255,255,.88)\"><i class=\"ph-duotone ph-info\" style=\"flex:none;font-size:18px;color:#d49bff\"><\u002Fi><span>{{ note }}<\u002Fspan><\u002Fspan><\u002Fsc-if>\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <a href=\"{{ ctaHref }}\" style=\"display:flex;align-items:center;justify-content:center;gap:8px;padding:15px;border-radius:999px;font-size:15.5px;font-weight:800;color:#fff;background:linear-gradient(90deg,#e91f54,#a101ff);box-shadow:0 10px 24px rgba(233,31,84,.3)\" style-hover=\"color:#fff;filter:brightness(1.08)\">{{ ctaLabel }}<i class=\"ph-bold ph-arrow-right\"><\u002Fi><\u002Fa>\n        <span style=\"font-size:12.5px;line-height:1.5;text-align:center;color:rgba(255,255,255,.75)\">{{ ctaSub }}<\u002Fspan>\n        <sc-if value=\"{{ isEnt }}\" hint-placeholder-val=\"{{ false }}\"><a href=\"https://cinema8.com/signup\" style=\"text-align:center;padding:12px;border-radius:999px;font-size:14px;font-weight:800;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)\" style-hover=\"color:#fff;box-shadow:inset 0 0 0 1px #fff\">Start free while we prepare your quote<\u002Fa><\u002Fsc-if>\n        <sc-if value=\"{{ notEnt }}\" hint-placeholder-val=\"{{ true }}\"><a href=\"pricing-3.html\" style=\"text-align:center;padding:12px;border-radius:999px;font-size:14px;font-weight:700;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)\" style-hover=\"color:#fff;box-shadow:inset 0 0 0 1px #fff\">See what each plan includes<\u002Fa><\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Faside>\n  <\u002Fdiv>\n  <p style=\"max-width:860px;margin:24px auto 0;font-size:12.5px;line-height:1.6;text-align:center;color:#6b7080\">Estimates use typical adaptive-streaming bitrates and are not a quote. Real usage depends on encoding, devices, viewer connections and how long people watch. Taxes not included.<\u002Fp>\n<\u002Fsection>\n\n<section data-screen-label=\"How it works\" style=\"max-width:880px;margin:0 auto;padding:120px clamp(20px,5vw,40px) 0;display:flex;flex-direction:column;gap:22px\">\n  <h2 style=\"margin:0;font-family:Exo,sans-serif;font-size:clamp(26px,3vw,38px);letter-spacing:-0.02em\">How to calculate video hosting storage and bandwidth<\u002Fh2>\n  <p style=\"margin:0;font-size:17px;line-height:1.8;color:#4a4f5c\"><b style=\"color:#1e2228\">Storage is the size of your video files. Bandwidth is the data sent to viewers when they press play.<\u002Fb> Both come from the same number: the bitrate of the video, measured in megabits per second (Mbps). A bitrate of 5 Mbps produces 37.5 MB of data for every minute of video, because 5 megabits × 60 seconds ÷ 8 bits per byte = 37.5 megabytes.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px\">\n    <div style=\"display:flex;flex-direction:column;gap:8px;padding:24px;border-radius:20px;background:#f6f7f9\"><span style=\"font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#7000b3\">Storage<\u002Fspan><span style=\"font-size:17px;font-weight:800;line-height:1.5\">Videos × average length × MB per minute<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:8px;padding:24px;border-radius:20px;background:#f6f7f9\"><span style=\"font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#7000b3\">Monthly bandwidth<\u002Fspan><span style=\"font-size:17px;font-weight:800;line-height:1.5\">Views × average length × share watched × MB per minute<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:8px;padding:24px;border-radius:20px;background:#fde8ee\"><span style=\"font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#a01233\">Live streaming<\u002Fspan><span style=\"font-size:17px;font-weight:800;line-height:1.5\">Viewers × hours live × GB per hour<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <h3 style=\"margin:24px 0 0;font-family:Exo,sans-serif;font-size:22px\">A worked example<\u002Fh3>\n  <p style=\"margin:0;font-size:17px;line-height:1.8;color:#4a4f5c\">A training team hosts 100 videos of 5 minutes each in 1080p. That library takes 100 × 5 × 37.5 MB = 18,750 MB, or about <b style=\"color:#1e2228\">18 GB of storage<\u002Fb>. The videos get 10,000 views a month and viewers watch 60% on average, so they stream 30,000 minutes. At 37.5 MB a minute that is about <b style=\"color:#1e2228\">1.07 TB of bandwidth a month<\u002Fb>. Bandwidth is usually the bigger number, and it grows with your audience rather than your library.<\u002Fp>\n<\u002Fsection>\n\n<section data-screen-label=\"Bitrate table\" style=\"max-width:880px;margin:0 auto;padding:88px clamp(20px,5vw,40px) 0;display:flex;flex-direction:column;gap:22px\">\n  <h2 style=\"margin:0;font-family:Exo,sans-serif;font-size:clamp(26px,3vw,38px);letter-spacing:-0.02em\">How much data does each video quality use?<\u002Fh2>\n  <p style=\"margin:0;font-size:17px;line-height:1.8;color:#4a4f5c\">These are typical bitrates for adaptive streaming with H.264. Higher resolutions cost more storage and bandwidth per minute. The calculator uses the same figures.<\u002Fp>\n  <div style=\"overflow-x:auto;border-radius:20px;box-shadow:inset 0 0 0 1px rgba(30,34,40,.1)\">\n    <sc-raw-table style=\"width:100%;min-width:520px;border-collapse:collapse;font-size:15px\">\n      <sc-raw-thead><sc-raw-tr style=\"text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#6b7080\"><sc-raw-th style=\"padding:16px 20px\">Quality<\u002Fsc-raw-th><sc-raw-th style=\"padding:16px 20px\">Typical bitrate<\u002Fsc-raw-th><sc-raw-th style=\"padding:16px 20px\">Per minute<\u002Fsc-raw-th><sc-raw-th style=\"padding:16px 20px\">Per hour<\u002Fsc-raw-th><sc-raw-th style=\"padding:16px 20px\">1,000 one-hour views<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-raw-tr style=\"box-shadow:inset 0 1px 0 rgba(30,34,40,.08)\"><sc-raw-td style=\"padding:16px 20px;font-weight:800\">720p (HD)<\u002Fsc-raw-td><sc-raw-td style=\"padding:16px 20px\">2.5 Mbps<\u002Fsc-raw-td><sc-raw-td style=\"padding:16px 20px\">19 MB<\u002Fsc-raw-td><sc-raw-td style=\"padding:16px 20px\">1.1 GB<\u002Fsc-raw-td><sc-raw-td style=\"padding:16px 20px\">1.1 TB<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr style=\"box-shadow:inset 0 1px 0 rgba(30,34,40,.08);background:#faf5ff\"><sc-raw-td style=\"padding:16px 20px;font-weight:800\">1080p (Full HD)<\u002Fsc-raw-td><sc-raw-td style=\"padding:16px 20px\">5 Mbps<\u002Fsc-raw-td><sc-raw-td style=\"padding:16px 20px\">37.5 MB<\u002Fsc-raw-td><sc-raw-td style=\"padding:16px 20px\">2.2 GB<\u002Fsc-raw-td><sc-raw-td style=\"padding:16px 20px\">2.1 TB<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr style=\"box-shadow:inset 0 1px 0 rgba(30,34,40,.08)\"><sc-raw-td style=\"padding:16px 20px;font-weight:800\">1440p (QHD)<\u002Fsc-raw-td><sc-raw-td style=\"padding:16px 20px\">9 Mbps<\u002Fsc-raw-td><sc-raw-td style=\"padding:16px 20px\">67.5 MB<\u002Fsc-raw-td><sc-raw-td style=\"padding:16px 20px\">4.0 GB<\u002Fsc-raw-td><sc-raw-td style=\"padding:16px 20px\">3.9 TB<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr style=\"box-shadow:inset 0 1px 0 rgba(30,34,40,.08)\"><sc-raw-td style=\"padding:16px 20px;font-weight:800\">2160p (4K)<\u002Fsc-raw-td><sc-raw-td style=\"padding:16px 20px\">16 Mbps<\u002Fsc-raw-td><sc-raw-td style=\"padding:16px 20px\">120 MB<\u002Fsc-raw-td><sc-raw-td style=\"padding:16px 20px\">7.0 GB<\u002Fsc-raw-td><sc-raw-td style=\"padding:16px 20px\">6.9 TB<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n  <\u002Fdiv>\n  <p style=\"margin:0;font-size:17px;line-height:1.8;color:#4a4f5c\">For most marketing, product and training videos, 1080p is the right balance. Use 4K for films, product close-ups or content watched on large screens. With adaptive bitrate streaming, viewers on phones or slow connections receive a lower rendition automatically, so real bandwidth is often below these numbers.<\u002Fp>\n<\u002Fsection>\n\n<section data-screen-label=\"Storage vs bandwidth\" style=\"max-width:880px;margin:0 auto;padding:88px clamp(20px,5vw,40px) 0;display:flex;flex-direction:column;gap:22px\">\n  <h2 style=\"margin:0;font-family:Exo,sans-serif;font-size:clamp(26px,3vw,38px);letter-spacing:-0.02em\">Storage vs bandwidth: which one limits you?<\u002Fh2>\n  <p style=\"margin:0;font-size:17px;line-height:1.8;color:#4a4f5c\"><b style=\"color:#1e2228\">Storage grows when you upload. Bandwidth grows when people watch.<\u002Fb> A course library with 500 lessons but a few hundred students is storage-heavy. A single launch video watched 200,000 times is bandwidth-heavy. Check both numbers in the calculator; the plan you need is set by whichever runs out first.<\u002Fp>\n  <h3 style=\"margin:16px 0 0;font-family:Exo,sans-serif;font-size:22px\">How to calculate live streaming bandwidth<\u002Fh3>\n  <p style=\"margin:0;font-size:17px;line-height:1.8;color:#4a4f5c\">Live video works like on-demand video, except every viewer watches at the same time. Multiply average viewers by hours live and by the data per hour for your stream quality. A one-hour 1080p webinar with 500 viewers sends about 500 × 2.2 GB = 1.1 TB. Upload speed matters too: plan for at least 1.5× the stream bitrate, so around 8 Mbps up for a 1080p stream.<\u002Fp>\n  <h3 style=\"margin:16px 0 0;font-family:Exo,sans-serif;font-size:22px\">Five ways to use less bandwidth<\u002Fh3>\n  <ol style=\"margin:0;padding-left:22px;display:flex;flex-direction:column;gap:12px;font-size:17px;line-height:1.75;color:#4a4f5c\">\n    <li><b style=\"color:#1e2228\">Upload at the resolution people watch.<\u002Fb> A 4K upload of a talking-head video uses about three times the data of 1080p with little visible gain.<\u002Fli>\n    <li><b style=\"color:#1e2228\">Keep adaptive bitrate streaming on.<\u002Fb> Viewers get the rendition their screen and connection can use, not the largest file.<\u002Fli>\n    <li><b style=\"color:#1e2228\">Avoid autoplay on busy pages.<\u002Fb> Autoplaying videos stream data for visitors who never meant to watch.<\u002Fli>\n    <li><b style=\"color:#1e2228\">Use chapters.<\u002Fb> Viewers jump to the part they need instead of scrubbing through the whole video.<\u002Fli>\n    <li><b style=\"color:#1e2228\">Watch your analytics.<\u002Fb> Drop-off charts show which videos are worth shortening or splitting.<\u002Fli>\n  <\u002Fol>\n<\u002Fsection>\n\n<section data-screen-label=\"What every plan includes\" style=\"max-width:1200px;margin:0 auto;padding:110px clamp(16px,4vw,40px) 0;display:flex;flex-direction:column;gap:32px\">\n  <div style=\"max-width:760px;display:flex;flex-direction:column;gap:14px\">\n    <h2 style=\"margin:0;font-family:Exo,sans-serif;font-size:clamp(26px,3vw,38px);letter-spacing:-0.02em\">More than storage and bandwidth<\u002Fh2>\n    <p style=\"margin:0;font-size:17px;line-height:1.8;color:#4a4f5c\">Cinema8 hosts, streams and makes your videos interactive in one place. Here is what you get as you grow.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px\">\n    <div style=\"display:flex;flex-direction:column;gap:10px;padding:26px;border-radius:22px;background:#f6f7f9\"><i class=\"ph-duotone ph-globe-hemisphere-west\" style=\"font-size:30px;color:#a101ff\"><\u002Fi><h3 style=\"margin:0;font-size:17px;font-weight:800\">Global delivery<\u002Fh3><p style=\"margin:0;font-size:15px;line-height:1.65;color:#4a4f5c\">Adaptive bitrate streaming over a global CDN, with an ad-free player on every plan.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:10px;padding:26px;border-radius:22px;background:#f6f7f9\"><i class=\"ph-duotone ph-broadcast\" style=\"font-size:30px;color:#e91f54\"><\u002Fi><h3 style=\"margin:0;font-size:17px;font-weight:800\">Live streams and webinars<\u002Fh3><p style=\"margin:0;font-size:15px;line-height:1.65;color:#4a4f5c\">Go live with Live Free on any plan. Live Basic, Pro and Scale add hours, destinations and guests.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:10px;padding:26px;border-radius:22px;background:#f6f7f9\"><i class=\"ph-duotone ph-cursor-click\" style=\"font-size:30px;color:#a101ff\"><\u002Fi><h3 style=\"margin:0;font-size:17px;font-weight:800\">Interactive video<\u002Fh3><p style=\"margin:0;font-size:15px;line-height:1.65;color:#4a4f5c\">CTAs, hotspots, chapters and lead forms on every plan. Add branching, quizzes and 360° when you need them.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:10px;padding:26px;border-radius:22px;background:#f6f7f9\"><i class=\"ph-duotone ph-sparkle\" style=\"font-size:30px;color:#a101ff\"><\u002Fi><h3 style=\"margin:0;font-size:17px;font-weight:800\">AI built in<\u002Fh3><p style=\"margin:0;font-size:15px;line-height:1.65;color:#4a4f5c\">AI subtitles, translations, chapter suggestions, Ask AI in the player and AI tools for creating video.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:10px;padding:26px;border-radius:22px;background:#f6f7f9\"><i class=\"ph-duotone ph-chart-line-up\" style=\"font-size:30px;color:#a101ff\"><\u002Fi><h3 style=\"margin:0;font-size:17px;font-weight:800\">Analytics<\u002Fh3><p style=\"margin:0;font-size:15px;line-height:1.65;color:#4a4f5c\">A statistics dashboard and A/B tests on every plan, with heatmaps and interaction reports from Pro.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:10px;padding:26px;border-radius:22px;background:#f6f7f9\"><i class=\"ph-duotone ph-television-simple\" style=\"font-size:30px;color:#a101ff\"><\u002Fi><h3 style=\"margin:0;font-size:17px;font-weight:800\">Channels and portals<\u002Fh3><p style=\"margin:0;font-size:15px;line-height:1.65;color:#4a4f5c\">Publish to a branded video hub, academy, screening room or streaming service, with login and paywall options.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:10px;padding:26px;border-radius:22px;background:#f6f7f9\"><i class=\"ph-duotone ph-lock-key\" style=\"font-size:30px;color:#a101ff\"><\u002Fi><h3 style=\"margin:0;font-size:17px;font-weight:800\">Security<\u002Fh3><p style=\"margin:0;font-size:15px;line-height:1.65;color:#4a4f5c\">Password protection on every plan, plus domain restriction, in-video SSO and data encryption on higher plans.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:10px;padding:26px;border-radius:22px;background:#f6f7f9\"><i class=\"ph-duotone ph-plugs-connected\" style=\"font-size:30px;color:#a101ff\"><\u002Fi><h3 style=\"margin:0;font-size:17px;font-weight:800\">Integrations<\u002Fh3><p style=\"margin:0;font-size:15px;line-height:1.65;color:#4a4f5c\">Embed anywhere, connect your CRM and email tools, and use the JS and server APIs, webhooks and SCORM export.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"Pay as you grow\" style=\"max-width:1200px;margin:0 auto;padding:110px clamp(16px,4vw,40px) 0\">\n  <div style=\"display:flex;flex-wrap:wrap;gap:32px 56px;padding:clamp(28px,5vw,56px);border-radius:32px;color:#fff;background:radial-gradient(ellipse at 0% 0%,rgba(161,1,255,.5),transparent 60%),radial-gradient(ellipse at 100% 100%,rgba(233,31,84,.35),transparent 55%),#16121f\">\n    <div style=\"flex:1 1 360px;min-width:0;display:flex;flex-direction:column;gap:16px\">\n      <h2 style=\"margin:0;font-family:Exo,sans-serif;font-size:clamp(26px,3vw,38px);letter-spacing:-0.02em\">Start free. Pay as you grow.<\u002Fh2>\n      <p style=\"margin:0;font-size:17px;line-height:1.75;color:rgba(255,255,255,.82)\">The Free plan hosts 10 videos with 500 GB of bandwidth a month, an ad-free player, AI subtitles and 3 hours of live streaming. When you need more, upgrade or add capacity packs. You never pay per view.<\u002Fp>\n      <a href=\"https://cinema8.com/signup\" style=\"align-self:flex-start;display:flex;align-items:center;gap:8px;padding:15px 26px;border-radius:999px;font-size:15.5px;font-weight:800;color:#fff;background:linear-gradient(90deg,#e91f54,#a101ff)\" style-hover=\"color:#fff;filter:brightness(1.08)\">Create free account<i class=\"ph-bold ph-arrow-right\"><\u002Fi><\u002Fa>\n    <\u002Fdiv>\n    <ol style=\"flex:1 1 360px;min-width:0;margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:18px\">\n      <li style=\"display:flex;gap:14px\"><span style=\"flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.12);font-weight:800\">1<\u002Fspan><span style=\"display:flex;flex-direction:column;gap:2px\"><b style=\"font-size:16px\">Alerts before you hit a limit<\u002Fb><span style=\"font-size:15px;line-height:1.6;color:rgba(255,255,255,.78)\">We email you at 80% and 90% of your storage and bandwidth.<\u002Fspan><\u002Fspan><\u002Fli>\n      <li style=\"display:flex;gap:14px\"><span style=\"flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.12);font-weight:800\">2<\u002Fspan><span style=\"display:flex;flex-direction:column;gap:2px\"><b style=\"font-size:16px\">Add capacity in packs<\u002Fb><span style=\"font-size:15px;line-height:1.6;color:rgba(255,255,255,.78)\">On Pro Plus and Business, buy storage from +100 GB and bandwidth from +1 TB, only for the months you need it.<\u002Fspan><\u002Fspan><\u002Fli>\n      <li style=\"display:flex;gap:14px\"><span style=\"flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.12);font-weight:800\">3<\u002Fspan><span style=\"display:flex;flex-direction:column;gap:2px\"><b style=\"font-size:16px\">Change plans any time<\u002Fb><span style=\"font-size:15px;line-height:1.6;color:rgba(255,255,255,.78)\">Upgrade instantly, or move down at the end of your billing period.<\u002Fspan><\u002Fspan><\u002Fli>\n    <\u002Fol>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"FAQ\" style=\"max-width:880px;margin:0 auto;padding:110px clamp(20px,5vw,40px) 40px;display:flex;flex-direction:column;gap:12px\">\n  <h2 style=\"margin:0 0 18px;font-family:Exo,sans-serif;font-size:clamp(26px,3vw,38px);letter-spacing:-0.02em\">Frequently asked questions<\u002Fh2>\n  <details data-faq=\"1\" style=\"border-radius:18px;background:#f6f7f9\"><summary style=\"cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 24px;font-size:16.5px;font-weight:800\">How do I calculate video hosting bandwidth?<i class=\"ph-bold ph-plus\" style=\"flex:none;transition:transform .2s\"><\u002Fi><\u002Fsummary><p style=\"margin:0;padding:0 24px 22px;font-size:16px;line-height:1.75;color:#4a4f5c\">Multiply monthly views by the average minutes watched per view and by the data per minute for your video quality. At 1080p (about 37.5 MB a minute), 10,000 views of a 5-minute video watched 60% of the way uses about 1.07 TB a month.<\u002Fp><\u002Fdetails>\n  <details data-faq=\"1\" style=\"border-radius:18px;background:#f6f7f9\"><summary style=\"cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 24px;font-size:16.5px;font-weight:800\">How much storage does one hour of video use?<i class=\"ph-bold ph-plus\" style=\"flex:none;transition:transform .2s\"><\u002Fi><\u002Fsummary><p style=\"margin:0;padding:0 24px 22px;font-size:16px;line-height:1.75;color:#4a4f5c\">About 1.1 GB at 720p, 2.2 GB at 1080p, 4 GB at 1440p and 7 GB at 4K, using typical streaming bitrates. Files exported at very high bitrates from editing software can be several times larger.<\u002Fp><\u002Fdetails>\n  <details data-faq=\"1\" style=\"border-radius:18px;background:#f6f7f9\"><summary style=\"cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 24px;font-size:16.5px;font-weight:800\">How much bandwidth do 1,000 video views use?<i class=\"ph-bold ph-plus\" style=\"flex:none;transition:transform .2s\"><\u002Fi><\u002Fsummary><p style=\"margin:0;padding:0 24px 22px;font-size:16px;line-height:1.75;color:#4a4f5c\">It depends on length and quality. 1,000 full views of a 10-minute 1080p video use about 366 GB. The same views of a 2-minute video use about 73 GB.<\u002Fp><\u002Fdetails>\n  <details data-faq=\"1\" style=\"border-radius:18px;background:#f6f7f9\"><summary style=\"cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 24px;font-size:16.5px;font-weight:800\">How do I calculate live streaming bandwidth?<i class=\"ph-bold ph-plus\" style=\"flex:none;transition:transform .2s\"><\u002Fi><\u002Fsummary><p style=\"margin:0;padding:0 24px 22px;font-size:16px;line-height:1.75;color:#4a4f5c\">Multiply average viewers by hours live and by the data per hour for your stream quality. A one-hour 1080p stream with 500 viewers sends about 1.1 TB. On your side, plan for an upload speed of at least 1.5 times the stream bitrate.<\u002Fp><\u002Fdetails>\n  <details data-faq=\"1\" style=\"border-radius:18px;background:#f6f7f9\"><summary style=\"cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 24px;font-size:16.5px;font-weight:800\">What is the difference between storage and bandwidth?<i class=\"ph-bold ph-plus\" style=\"flex:none;transition:transform .2s\"><\u002Fi><\u002Fsummary><p style=\"margin:0;padding:0 24px 22px;font-size:16px;line-height:1.75;color:#4a4f5c\">Storage is the space your uploaded videos take up. Bandwidth is the data transferred each month when people watch them. Storage grows with your library; bandwidth grows with your audience.<\u002Fp><\u002Fdetails>\n  <details data-faq=\"1\" style=\"border-radius:18px;background:#f6f7f9\"><summary style=\"cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 24px;font-size:16.5px;font-weight:800\">Is there a free video hosting plan?<i class=\"ph-bold ph-plus\" style=\"flex:none;transition:transform .2s\"><\u002Fi><\u002Fsummary><p style=\"margin:0;padding:0 24px 22px;font-size:16px;line-height:1.75;color:#4a4f5c\">Yes. Cinema8 Free has no time limit and includes 10 videos, 500 GB of bandwidth a month, an ad-free player, buttons and hotspots, AI subtitles and 3 hours of live streaming a month. No credit card is needed.<\u002Fp><\u002Fdetails>\n  <details data-faq=\"1\" style=\"border-radius:18px;background:#f6f7f9\"><summary style=\"cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 24px;font-size:16.5px;font-weight:800\">Can I pay only for what I use?<i class=\"ph-bold ph-plus\" style=\"flex:none;transition:transform .2s\"><\u002Fi><\u002Fsummary><p style=\"margin:0;padding:0 24px 22px;font-size:16px;line-height:1.75;color:#4a4f5c\">Yes. Start on Free, move to the plan that fits when you need more, and on Pro Plus or Business add storage and bandwidth packs for busy months. There are no per-view charges.<\u002Fp><\u002Fdetails>\n  <details data-faq=\"1\" style=\"border-radius:18px;background:#f6f7f9\"><summary style=\"cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 24px;font-size:16.5px;font-weight:800\">What happens if I go over my bandwidth?<i class=\"ph-bold ph-plus\" style=\"flex:none;transition:transform .2s\"><\u002Fi><\u002Fsummary><p style=\"margin:0;padding:0 24px 22px;font-size:16px;line-height:1.75;color:#4a4f5c\">Cinema8 warns you at 80% and 90% of your limit on every plan, so you have time to upgrade or add a bandwidth pack before anything is interrupted. Pro Plus and Business can buy extra storage and bandwidth at any time.<\u002Fp><\u002Fdetails>\n  <details data-faq=\"1\" style=\"border-radius:18px;background:#f6f7f9\"><summary style=\"cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 24px;font-size:16.5px;font-weight:800\">Does adaptive bitrate streaming reduce bandwidth?<i class=\"ph-bold ph-plus\" style=\"flex:none;transition:transform .2s\"><\u002Fi><\u002Fsummary><p style=\"margin:0;padding:0 24px 22px;font-size:16px;line-height:1.75;color:#4a4f5c\">Usually, yes. The player picks the rendition that suits each viewer's screen and connection, so phones and slow networks receive smaller files. This calculator assumes everyone watches at your upload quality, which makes it a safe upper estimate.<\u002Fp><\u002Fdetails>\n  <details data-faq=\"1\" style=\"border-radius:18px;background:#f6f7f9\"><summary style=\"cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 24px;font-size:16.5px;font-weight:800\">Do I need a separate plan for live streaming?<i class=\"ph-bold ph-plus\" style=\"flex:none;transition:transform .2s\"><\u002Fi><\u002Fsummary><p style=\"margin:0;padding:0 24px 22px;font-size:16px;line-height:1.75;color:#4a4f5c\">No. Every plan includes Live Free. For more hours, destinations and guests, add Live Basic ($10/mo), Live Pro ($39/mo) or Live Scale ($159/mo), billed yearly.<\u002Fp><\u002Fdetails>\n  <details data-faq=\"1\" style=\"border-radius:18px;background:#f6f7f9\"><summary style=\"cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 24px;font-size:16.5px;font-weight:800\">What does the interactive video add-on include?<i class=\"ph-bold ph-plus\" style=\"flex:none;transition:transform .2s\"><\u002Fi><\u002Fsummary><p style=\"margin:0;padding:0 24px 22px;font-size:16px;line-height:1.75;color:#4a4f5c\">Interaction Designer Pro adds multiple layers, branching, every question type, scoring and gamification, the 360° interactivity studio and sticky hotspots. It costs $299/mo on Starter and Pro, $249/mo on Pro Plus, and is included in Business.<\u002Fp><\u002Fdetails>\n  <details data-faq=\"1\" style=\"border-radius:18px;background:#f6f7f9\"><summary style=\"cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 24px;font-size:16.5px;font-weight:800\">Is yearly billing cheaper?<i class=\"ph-bold ph-plus\" style=\"flex:none;transition:transform .2s\"><\u002Fi><\u002Fsummary><p style=\"margin:0;padding:0 24px 22px;font-size:16px;line-height:1.75;color:#4a4f5c\">Yes, yearly billing saves 20% compared with paying monthly. Use the Yearly and Monthly switch in the estimate to see both prices.<\u002Fp><\u002Fdetails>\n  <details data-faq=\"1\" style=\"border-radius:18px;background:#f6f7f9\"><summary style=\"cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 24px;font-size:16.5px;font-weight:800\">How accurate is this calculator?<i class=\"ph-bold ph-plus\" style=\"flex:none;transition:transform .2s\"><\u002Fi><\u002Fsummary><p style=\"margin:0;padding:0 24px 22px;font-size:16px;line-height:1.75;color:#4a4f5c\">It uses standard bitrates and the formulas shown on this page, so it is a good planning estimate. Real usage changes with encoding settings, devices, viewer connections and watch time. Your dashboard shows actual storage and bandwidth once you start.<\u002Fp><\u002Fdetails>\n  <details data-faq=\"1\" style=\"border-radius:18px;background:#f6f7f9\"><summary style=\"cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 24px;font-size:16.5px;font-weight:800\">When should I talk to sales?<i class=\"ph-bold ph-plus\" style=\"flex:none;transition:transform .2s\"><\u002Fi><\u002Fsummary><p style=\"margin:0;padding:0 24px 22px;font-size:16px;line-height:1.75;color:#4a4f5c\">If your estimate is above $2,500 a month, or you need custom limits, SSO, a dedicated success manager or an SLA, an Enterprise plan with volume pricing is usually better value.<\u002Fp><\u002Fdetails>\n<\u002Fsection>\n\n<footer style=\"display:flex;flex-direction:column;align-items:center;gap:12px;padding:56px 20px 56px;font-size:12px;color:#6b7080\">\n  <div style=\"display:flex;flex-wrap:wrap;justify-content:center;gap:8px 18px;font-weight:700\"><span>ISO/IEC 27001<\u002Fspan><span>ISO 9001<\u002Fspan><span>ISO 10002<\u002Fspan><span>ISO 45001<\u002Fspan><span>BESA<\u002Fspan><\u002Fdiv>\n  <span>© 2026 Cinema8 Ltd. St John's Innovation Centre, Cambridge CB4 0WS<\u002Fspan>\n<\u002Ffooter>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst PL=[{k:'free',n:'Free',yr:0,mo:0,st:2,bw:500,vid:10},{k:'starter',n:'Starter',yr:12,mo:15,st:100,bw:1024,vid:60,iv:299},{k:'pro',n:'Pro',yr:24,mo:30,st:500,bw:2048,vid:150,iv:299},{k:'proplus',n:'Pro Plus',yr:84,mo:105,st:2048,bw:2048,vid:600,iv:249,exp:1},{k:'business',n:'Business',yr:639,mo:799,st:5120,bw:15360,vid:Infinity,ivInc:1,exp:1}];\nconst BWP=[{gb:51200,p:2299,l:'50 TB'},{gb:15360,p:799,l:'15 TB'},{gb:5120,p:349,l:'5 TB'},{gb:1024,p:79,l:'1 TB'}];\nconst STP=[{gb:5120,p:549,l:'5 TB'},{gb:1024,p:149,l:'1 TB'},{gb:100,p:19,l:'100 GB'}];\nconst LV=[{n:'Live Free',h:3,yr:0,mo:0},{n:'Live Basic',h:20,yr:10,mo:13},{n:'Live Pro',h:60,yr:39,mo:49},{n:'Live Scale',h:200,yr:159,mo:199}];\nconst Q={'720':{l:'720p',sub:'2.5 Mbps',mbps:2.5},'1080':{l:'1080p',sub:'5 Mbps',mbps:5},'1440':{l:'1440p',sub:'9 Mbps',mbps:9},'2160':{l:'4K',sub:'16 Mbps',mbps:16}};\nconst SL={vids:{l:'Number of videos',min:1,max:5000,log:1,u:'videos'},len:{l:'Average video length',min:1,max:180,log:1,u:'min'},views:{l:'Views per month',min:100,max:5000000,log:1,u:'views'},watch:{l:'Average share watched',min:10,max:100,step:5,u:'%',hint:'50–70% is typical'},hours:{l:'Hours live per month',min:1,max:300,log:1,u:'hours'},viewers:{l:'Average live viewers',min:10,max:50000,log:1,u:'viewers'},buf:{l:'Growth buffer',min:0,max:100,step:10,u:'%',hint:'Headroom for a busy month'}};\nconst PRE=[['Marketing videos','ph-megaphone',{vids:60,len:3,q:'1080',views:25000,watch:50,live:false,iv:false}],['Online courses','ph-graduation-cap',{vids:300,len:12,q:'1080',views:40000,watch:70,live:false,iv:true}],['Films and series','ph-film-slate',{vids:40,len:45,q:'2160',views:30000,watch:65,live:false,iv:false}],['Webinars and events','ph-broadcast',{vids:25,len:45,q:'1080',views:4000,watch:40,live:true,hours:8,viewers:300,iv:false}],['Product demos','ph-cursor-click',{vids:30,len:2,q:'1080',views:8000,watch:75,live:false,iv:true}]];\nconst fmtGB=g=>g<1?Math.max(1,Math.round(g*1024))+' MB':g<1024?(g<10?g.toFixed(1):Math.round(g).toLocaleString('en-US'))+' GB':((g/1024)<10?(g/1024).toFixed(1):Math.round(g/1024).toLocaleString('en-US'))+' TB';\nconst fmtN=n=>n>=1e6?(n/1e6)+'M':n>=1000?(n/1000)+'k':String(n);\nconst usd=n=>'$'+Math.round(n).toLocaleString('en-US');\nconst nice=n=>{if(n<20)return Math.round(n);const p=Math.pow(10,Math.floor(Math.log10(n))-1);return Math.round(n/p)*p;};\nconst pack=(packs,gap)=>{if(gap<=0)return {p:0,items:[]};const big=packs[0];let n=Math.floor(gap/big.gb),rem=gap-n*big.gb,best=null;\n  if(rem>0){for(const pk of packs){const q=Math.ceil(rem/pk.gb),c=q*pk.p;if(!best||c<best.c)best={c,items:[[q,pk]]};}if(big.p<best.c)best={c:big.p,items:[[1,big]]};}else best={c:0,items:[]};\n  const items=[];if(n)items.push([n,big]);for(const [q,pk] of best.items){const ex=items.find(i=>i[1]===pk);if(ex)ex[0]+=q;else items.push([q,pk]);}\n  return {p:items.reduce((a,[q,pk])=>a+q*pk.p,0),items};};\nclass Component extends DCLogic {\n  state={menu:-1,vids:50,len:5,q:'1080',views:10000,watch:60,live:false,hours:4,viewers:200,lq:'1080',iv:false,buf:20,bill:'yr',plan:null,preset:null};\n  componentDidMount(){try{const qa=[...document.querySelectorAll('[data-faq]')].map(d=>({'@type':'Question',name:d.querySelector('summary').textContent.trim(),acceptedAnswer:{'@type':'Answer',text:d.querySelector('p').textContent.trim()}}));\n    const add=o=>{const sc=document.createElement('script');sc.type='application/ld+json';sc.textContent=JSON.stringify(o);document.head.appendChild(sc);};\n    add({'@context':'https://schema.org','@type':'FAQPage',mainEntity:qa});\n    add({'@context':'https://schema.org','@type':'WebApplication',name:'Video hosting, bandwidth and streaming calculator',applicationCategory:'BusinessApplication',operatingSystem:'Any',url:'https://cinema8.com/video-hosting-calculator',offers:{'@type':'Offer',price:'0',priceCurrency:'USD'},publisher:{'@type':'Organization',name:'Cinema8',url:'https://cinema8.com'}});}catch(e){}}\n  slider(k){const m=SL[k],s=this.state,v=s[k],t=m.log?Math.min(1000,Math.max(0,Math.round(1000*Math.log(Math.max(v,m.min)/m.min)/Math.log(m.max/m.min)))):Math.min(m.max,Math.max(m.min,v));\n    return {id:'c8-'+k,l:m.l,u:m.u,hint:m.hint||'',v,min:m.min,rmin:m.log?0:m.min,rmax:m.log?1000:m.max,rstep:m.log?1:(m.step||1),t,minL:fmtN(m.min)+(m.u==='%'?'%':''),maxL:fmtN(m.max)+(m.u==='%'?'%':'')+(m.log?'+':''),\n      onRange:e=>{const x=+e.target.value;this.setState({[k]:m.log?nice(m.min*Math.pow(m.max/m.min,x/1000)):x,preset:null,plan:null});},\n      onNum:e=>{let n=parseFloat(e.target.value);if(isNaN(n)||n<0)n=0;if(m.u==='%')n=Math.min(100,n);this.setState({[k]:n,preset:null,plan:null});}};}\n  renderVals(){\n    const s=this.state,yr=s.bill==='yr',mb=Q[s.q].mbps*7.5,buf=1+Math.max(0,s.buf)/100;\n    const vids=Math.max(0,Math.round(s.vids)),len=Math.max(0,s.len),needSt=vids*len*mb/1024,needBw=s.views*len*Math.min(100,s.watch)/100*mb/1024;\n    \n    const capSt=needSt*buf;\n    const lvP=s.live?(LV.find(l=>l.h>=s.hours)||LV[3]):LV[0],lvC=yr?lvP.yr:lvP.mo,lvBw=s.live?s.hours*s.viewers*Q[s.lq].mbps*450/1024:0,lvOver=s.live&&s.hours>200;\n    const needAll=needBw+lvBw,capBw=needAll*buf;\n    const ev=p=>{const r={p};if(s.iv&&p.k==='free'){r.off='Interactive add-on needs a paid plan';return r;}if(vids>p.vid){r.off='Up to '+p.vid+' videos';return r;}\n      const sg=capSt-p.st,bg=capBw-p.bw;if(!p.exp&&(sg>0||bg>0)){r.off=sg>0?'Holds '+fmtGB(p.st)+' storage':'Includes '+fmtGB(p.bw)+' bandwidth';return r;}\n      r.stp=pack(STP,sg);r.bwp=pack(BWP,bg);r.ivC=p.ivInc?0:(s.iv?p.iv:0);r.base=yr?p.yr:p.mo;r.total=r.base+r.ivC+r.stp.p+r.bwp.p+lvC;return r;};\n    const E=PL.map(ev),ok=E.filter(e=>!e.off),rec=ok.reduce((a,b)=>b.total<a.total?b:a,ok[0]);\n meter('Storage',needSt,totSt),meter(s.live?'Bandwidth per month (video + live)':'Bandwidth per month',needAll,totBw),{l:'Videos',v:vids.toLocaleString('en-US')+' of '+(p.vid===Infinity?'unlimited':p.vid),pct:p.vid===Infinity?Math.min(100,vids?8:0):Math.min(100,vids/p.vid*100),bar:'linear-gradient(90deg,#e91f54,#a101ff)'}];\n    if(s.live)meters.push({l:'Live hours ('+fmtGB(lvBw)+' of the bandwidth)',v:s.hours+' of '+lvP.h+' h',pct:Math.min(100,s.hours/lvP.h*100),bar:'linear-gradient(90deg,#e91f54,#ff8a5c)'});\n    const sw=on=>({t:on?'#a101ff':'#d9dbe1',k:on?'20px':'0'});\n    return {\n      presets:PRE.map(([l,icon,v],i)=>{const on=s.preset===i;return {l,icon,on,bg:on?'#16121f':'#fff',c:on?'#fff':'#1e2228',ring:on?'none':'inset 0 0 0 1px rgba(30,34,40,.14)',pick:()=>this.setState({...v,preset:i,plan:null})};}),\n      libSliders:['vids','len'].map(k=>this.slider(k)),audSliders:['views','watch'].map(k=>this.slider(k)),liveSliders:['hours','viewers'].map(k=>this.slider(k)),bufSliders:[this.slider('buf')],\n      qOpts:Object.entries(Q).map(([k,q])=>[k,q.l,q.sub+' · '+(q.mbps*7.5).toFixed(q.mbps*7.5<100?1:0).replace('.0','')+' MB/min']).map(chip(s.q,v=>this.setState({q:v,preset:null,plan:null}))),\n      lqOpts:[['720','720p'],['1080','1080p']].map(chip(s.lq,v=>this.setState({lq:v}))),\n      live:s.live,liveToggle:()=>this.setState({live:!s.live,preset:null}),liveTrack:sw(s.live).t,liveKnob:sw(s.live).k,liveBg:s.live?'#fff1f4':'#f6f7f9',\n      iv:s.iv,ivToggle:()=>this.setState({iv:!s.iv,preset:null}),ivTrack:sw(s.iv).t,ivKnob:sw(s.iv).k,ivBg:s.iv?'#f5e8ff':'#f6f7f9',\n      plans:E.map(e=>{const on=!e.off&&e.p.k===p.k,isRec=!e.off&&e.p.k===rec.p.k;return {name:e.p.n,total:e.off?'—':(e.total>2500?'Custom':(e.total?usd(e.total):'$0')),isRec,on,off:!!e.off,cur:e.off?'not-allowed':'pointer',op:e.off?.5:1,\n        note:e.off?e.off:e.total>2500?'Volume pricing via sales':(e.stp.items.length||e.bwp.items.length?'Includes capacity packs':(e.p.k==='business'?'Interactive add-on included':'Covers your usage')),noteC:e.off?'#6b7080':'#4a4f5c',\n        bg:on?'#f5e8ff':'#fff',ring:on?'inset 0 0 0 2px #a101ff':'inset 0 0 0 1px rgba(30,34,40,.12)',pick:()=>{if(!e.off)this.setState({plan:e.p.k});}};}),\n      bills:[['yr','Yearly'],['mo','Monthly']].map(([k,l])=>{const on=s.bill===k;return {l,on,c:on?'#16121f':'#fff',bg:on?'#fff':'transparent',pick:()=>this.setState({bill:k})};}),\n      planName:ent?'Enterprise':p.n+(p.k===rec.p.k?' · best fit':''),total:ent?'$2,500':usd(cur.total),totalPre:ent?'From':'',ctaHref:ent?'https://cinema8.com/contact-us':'https://cinema8.com/signup',ctaSub:ent?'Custom limits, volume pricing, SSO and a dedicated success manager.':'No credit card. Upgrade or add capacity only when you need it.',\n      billNote:ent?'Custom quote based on your usage':cur.total===0?'Free forever, no card needed':(yr?(save>0?'Billed yearly · saves '+usd(save)+' a year':'Billed yearly'):'Billed monthly'),\n      meters,lines,hasNote:!!note,note,isEnt:ent,notEnt:!ent,\n      ctaLabel:ent?'Talk to sales':p.k==='free'?'Start free':'Start free, upgrade when ready',\n      menuOpen:s.menu>=0,menuClose:()=>{if(s.menu!==-1)this.setState({menu:-1});},\n      menus:MENU.map((m,i)=>({label:m.label,bg:s.menu===i?'#f6f7f9':'transparent',rot:s.menu===i?'rotate(180deg)':'none',open:()=>{if(s.menu!==i)this.setState({menu:i});}})),\n      menuGroups:s.menu>=0?MENU[s.menu].groups:[]\n    };\n  }\n}\nconst MENU=[\n {label:'Platform',groups:[\n  {title:'Hosting',links:[['Video hosting','video-hosting.html','ph-cloud-arrow-up'],['Video library','/video-library','ph-books'],['Ad free player','/video-player','ph-play-circle']]},\n  {title:'Streaming',links:[['Video streaming','/video-streaming','ph-monitor-play'],['Video monetisation','/video-monetisation','ph-currency-circle-dollar']]},\n  {title:'Live streaming',links:[['Live streaming','/live-streaming','ph-broadcast'],['Live streaming pricing','/live-streaming-pricing','ph-tag']]},\n  {title:'Create'
